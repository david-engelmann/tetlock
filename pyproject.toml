[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "wallofwrong"
version = "0.1.0"
description = "Confessions before destructive calls, graded against what happened"
requires-python = ">=3.11"
license = {text = "MIT"}

[project.scripts]
wallofwrong = "wallofwrong.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
